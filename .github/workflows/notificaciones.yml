name: Notificaciones de Agenda Madai por Telegram

on:
  schedule:
    # 03:00 UTC = 10:00 PM Hora Perú
    - cron: '0 3 * * *'
    # 12:00 UTC = 07:00 AM Hora Perú
    - cron: '0 12 * * *'
  workflow_dispatch:

jobs:
  enviar_notificacion:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Instalar dependencias
        run: pip install pandas openpyxl requests

      - name: Ejecutar Notificador de Telegram
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python notificador_telegram.py
