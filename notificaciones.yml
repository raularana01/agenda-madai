name: Notificaciones de Agenda Madai por Telegram

on:
  schedule:
    # 00:00 UTC = 07:00 PM Hora Perú
    - cron: '0 0 * * *'
    # 12:00 UTC = 07:00 AM Hora Perú
    - cron: '0 12 * * *'
  workflow_dispatch:

jobs:
  enviar_notificacion:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4.2.2

      - name: Configurar Python
        uses: actions/setup-python@v5.3.0
        with:
          python-version: '3.10'

      - name: Instalar dependencias
        run: pip install pandas openpyxl requests

      - name: Ejecutar Notificador de Telegram
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GOOGLESHEETURL: ${{ secrets.GOOGLE_SHEET_URL }}
          GOOGLE_SHEET_URL: ${{ secrets.GOOGLE_SHEET_URL }}
        run: python notificador_telegram.py
